<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 748" width="700" height="748" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">GLM-5.4 loop design</title><desc id="d">GLM-5.4 has 78 stored layers. The prelude (layers 1 to 26) runs once and produces x0. Layers 27 to 54 run twice with shared weights. After each pass a damp gate blends the new output into the running state: x1 = x0 + beta1 times (h1 minus x0), and x2 = x1 + beta2 times (h2 minus x1), where each beta is a per-token value from a normalisation, a linear layer and a sigmoid. Pass 2 runs no indexer: it reuses pass 1's cached KV latents and top-2048 token picks, plus its own KV for a 128-token sliding window, under one softmax. The coda (layers 55 to 78) runs once. That is 106 layer applications per token.</desc><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a66"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d4f"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b06a2c"/></marker></defs><rect width="700" height="748" fill="#fcfcfb"/><text x="350" y="30" font-size="16" font-weight="bold" fill="#2b2a27" text-anchor="middle">GLM-5.4: 78 stored layers, 106 applied per token</text><rect x="60" y="54" width="330" height="46" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="225.0" y="74.0" font-size="14" font-weight="bold" fill="#2b2a27" text-anchor="middle">Input embedding</text><text x="225.0" y="90.0" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="middle">text + projected vision features</text><path d="M 225.0 100 L 225.0 119" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="60" y="120" width="330" height="50" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="225.0" y="142.5" font-size="15" font-weight="bold" fill="#2b2a27" text-anchor="middle">Prelude: layers 1–26</text><text x="225.0" y="158.5" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="middle">runs once</text><path d="M 225.0 170 L 225.0 207" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><text x="235.0" y="194" font-size="13" font-weight="bold" fill="#2b2a27" text-anchor="start">x0</text><rect x="60" y="208" width="330" height="50" rx="6" fill="#e7eff8" stroke="#3a6ea5" stroke-width="1.4"/><text x="225.0" y="230.5" font-size="15" font-weight="bold" fill="#1f4f82" text-anchor="middle">Loop pass 1: layers 27–54</text><text x="225.0" y="246.5" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="middle">28 layers, indexers pick top-2048 tokens</text><path d="M 225.0 258 L 225.0 283" fill="none" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#arrow-blue)"/><text x="235.0" y="276" font-size="13" font-weight="bold" fill="#1f4f82" text-anchor="start">h1</text><rect x="60" y="284" width="330" height="62" rx="6" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.4"/><text x="225.0" y="303.5" font-size="14" font-weight="bold" fill="#1f4f82" text-anchor="middle">Damp gate 1</text><text x="225.0" y="321.5" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">x1 = x0 + β1 · (h1 − x0)</text><text x="225.0" y="336.5" font-size="11" font-weight="normal" fill="#6b6a66" text-anchor="middle">β1 = σ(linear(norm(x0))), one per token</text><path d="M 225.0 346 L 225.0 383" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><text x="235.0" y="370" font-size="13" font-weight="bold" fill="#2b2a27" text-anchor="start">x1</text><rect x="60" y="384" width="330" height="50" rx="6" fill="#e7eff8" stroke="#3a6ea5" stroke-width="1.4"/><text x="225.0" y="406.5" font-size="15" font-weight="bold" fill="#1f4f82" text-anchor="middle">Loop pass 2: layers 27–54 again</text><text x="225.0" y="422.5" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="middle">same weights, no indexers</text><path d="M 225.0 434 L 225.0 459" fill="none" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#arrow-blue)"/><text x="235.0" y="452" font-size="13" font-weight="bold" fill="#1f4f82" text-anchor="start">h2</text><rect x="60" y="460" width="330" height="62" rx="6" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.4"/><text x="225.0" y="479.5" font-size="14" font-weight="bold" fill="#1f4f82" text-anchor="middle">Damp gate 2</text><text x="225.0" y="497.5" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">x2 = x1 + β2 · (h2 − x1)</text><text x="225.0" y="512.5" font-size="11" font-weight="normal" fill="#6b6a66" text-anchor="middle">β2 = σ(linear(norm(x1))), one per token</text><path d="M 225.0 522 L 225.0 559" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><text x="235.0" y="546" font-size="13" font-weight="bold" fill="#2b2a27" text-anchor="start">x2</text><rect x="60" y="560" width="330" height="50" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="225.0" y="582.5" font-size="15" font-weight="bold" fill="#2b2a27" text-anchor="middle">Coda: layers 55–78</text><text x="225.0" y="598.5" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="middle">runs once</text><path d="M 225.0 610 L 225.0 629" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="60" y="630" width="330" height="40" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="225.0" y="655.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Final norm → LM head → next token</text><rect x="430" y="208" width="250" height="50" rx="6" fill="#e8f3ec" stroke="#2e7d4f" stroke-width="1.4"/><text x="555.0" y="230.0" font-size="14" font-weight="bold" fill="#1e5c38" text-anchor="middle">Pass 1 cache, per layer</text><text x="555.0" y="246.0" font-size="12" font-weight="normal" fill="#1e5c38" text-anchor="middle">KV latents + top-2048 picks</text><path d="M 390 233 L 429 233" fill="none" stroke="#2e7d4f" stroke-width="1.5" marker-end="url(#arrow-green)"/><path d="M 505.0 258 L 505.0 398 L 391 398" fill="none" stroke="#2e7d4f" stroke-width="1.6" marker-end="url(#arrow-green)"/><text x="513.0" y="300" font-size="12" font-weight="normal" fill="#1e5c38" text-anchor="start">reused by pass 2:</text><text x="513.0" y="316" font-size="12" font-weight="normal" fill="#1e5c38" text-anchor="start">no new indexing,</text><text x="513.0" y="332" font-size="12" font-weight="normal" fill="#1e5c38" text-anchor="start">no second full cache</text><rect x="430" y="446" width="250" height="50" rx="6" fill="#f6ede4" stroke="#b06a2c" stroke-width="1.4"/><text x="555.0" y="468.0" font-size="14" font-weight="bold" fill="#7a4515" text-anchor="middle">Pass 2's own KV</text><text x="555.0" y="484.0" font-size="12" font-weight="normal" fill="#7a4515" text-anchor="middle">sliding window, last 128 tokens</text><path d="M 595.0 446 L 595.0 420 L 391 420" fill="none" stroke="#b06a2c" stroke-width="1.6" marker-end="url(#arrow-orange)"/><text x="430" y="528" font-size="12" font-weight="normal" fill="#2b2a27" text-anchor="start">Pass 2 attends over both banks</text><text x="430" y="544" font-size="12" font-weight="normal" fill="#2b2a27" text-anchor="start">with a single softmax.</text><text x="430" y="568" font-size="12" font-weight="normal" fill="#2b2a27" text-anchor="start">Extra cache for the second loop:</text><text x="430" y="584" font-size="12" font-weight="normal" fill="#2b2a27" text-anchor="start">one 128-token window per layer,</text><text x="430" y="600" font-size="12" font-weight="normal" fill="#2b2a27" text-anchor="start">not another full context.</text><text x="350" y="708" font-size="12" font-weight="normal" fill="#2b2a27" text-anchor="middle">26 + 28×2 + 24 = 106 layer applications per token from 78 stored layers.</text><text x="350" y="728" font-size="11" font-weight="normal" fill="#6b6a66" text-anchor="middle" font-style="italic">Redrawn and simplified from the architecture figure in Z.ai's GLM-5.4 post (Nov 23, 2026).</text></svg>
