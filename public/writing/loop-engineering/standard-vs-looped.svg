<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">A standard transformer next to a looped one</title><desc id="d">Left: six different layers, each run once. Right: the same six layers, but layers 3 and 4 form a block that runs three times with the same weights, so six stored layers give ten layer applications per token.</desc><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a66"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d4f"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b06a2c"/></marker></defs><rect width="640" height="480" fill="#fcfcfb"/><text x="160.0" y="32" font-size="16" font-weight="bold" fill="#2b2a27" text-anchor="middle">Standard transformer</text><text x="160.0" y="52" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">every layer runs once</text><text x="160.0" y="84" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">tokens in</text><path d="M 160.0 90 L 160.0 99" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="50" y="100" width="220" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="160.0" y="122.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 1</text><path d="M 160.0 134 L 160.0 154" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="50" y="155" width="220" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="160.0" y="177.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 2</text><path d="M 160.0 189 L 160.0 209" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="50" y="210" width="220" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="160.0" y="232.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 3</text><path d="M 160.0 244 L 160.0 265" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="50" y="266" width="220" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="160.0" y="288.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 4</text><path d="M 160.0 300 L 160.0 320" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="50" y="321" width="220" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="160.0" y="343.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 5</text><path d="M 160.0 355 L 160.0 375" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="50" y="376" width="220" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="160.0" y="398.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 6</text><path d="M 160.0 410 L 160.0 429" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><text x="160.0" y="444" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">next token</text><text x="160.0" y="470" font-size="13" font-weight="bold" fill="#2b2a27" text-anchor="middle">6 layers stored, 6 applied</text><text x="470.0" y="32" font-size="16" font-weight="bold" fill="#2b2a27" text-anchor="middle">Looped transformer</text><text x="470.0" y="52" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">the middle block runs 3 times</text><text x="470.0" y="84" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">tokens in</text><path d="M 470.0 90 L 470.0 99" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="370" y="100" width="200" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="470.0" y="122.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 1 (prelude)</text><path d="M 470.0 134 L 470.0 145" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="370" y="146" width="200" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="470.0" y="168.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 2 (prelude)</text><path d="M 470.0 180 L 470.0 193" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="358" y="194" width="224" height="124" rx="10" fill="#e7eff8" stroke="#3a6ea5" stroke-width="1.4"/><rect x="370" y="206" width="200" height="34" rx="6" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.4"/><text x="470.0" y="228.0" font-size="14" font-weight="bold" fill="#1f4f82" text-anchor="middle">Layer 3</text><path d="M 470.0 240 L 470.0 251" fill="none" stroke="#3a6ea5" stroke-width="1.5" marker-end="url(#arrow-blue)"/><rect x="370" y="252" width="200" height="34" rx="6" fill="#ffffff" stroke="#3a6ea5" stroke-width="1.4"/><text x="470.0" y="274.0" font-size="14" font-weight="bold" fill="#1f4f82" text-anchor="middle">Layer 4</text><text x="470.0" y="307" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="middle">same weights on every pass</text><path d="M 582 290 L 602 290 L 602 222 L 583 222" fill="none" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#arrow-blue)"/><text x="614" y="262" font-size="16" font-weight="bold" fill="#1f4f82" text-anchor="start">×3</text><path d="M 470.0 318 L 470.0 329" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="370" y="330" width="200" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="470.0" y="352.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 5 (coda)</text><path d="M 470.0 364 L 470.0 375" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="370" y="376" width="200" height="34" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="470.0" y="398.0" font-size="14" font-weight="normal" fill="#2b2a27" text-anchor="middle">Layer 6 (coda)</text><path d="M 470.0 410 L 470.0 430" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><text x="470.0" y="444" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">next token</text><text x="470.0" y="470" font-size="13" font-weight="bold" fill="#2b2a27" text-anchor="middle">6 stored, 2 + 2×3 + 2 = 10 applied</text></svg>
