<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Inkling 2 Mini loop design</title><desc id="d">Inkling 2 Mini has 24 stored layers in four blocks of six. The prelude (layers 1 to 6) runs once. Layers 7 to 18 run three times with shared weights; every pass reads the prelude output, and passes 2 and 3 also read the previous pass's output, called the message, through a learned gate. The final block (layers 19 to 24) runs once. That is 48 layer applications per token.</desc><defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6a66"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6ea5"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d4f"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b06a2c"/></marker></defs><rect width="640" height="600" fill="#fcfcfb"/><text x="320" y="30" font-size="16" font-weight="bold" fill="#2b2a27" text-anchor="middle">Inkling 2 Mini: 24 stored layers, 48 applied per token</text><text x="310.0" y="66" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">tokens in</text><path d="M 310.0 72 L 310.0 85" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="170" y="86" width="280" height="50" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="310.0" y="108.5" font-size="15" font-weight="bold" fill="#2b2a27" text-anchor="middle">Prelude: layers 1–6</text><text x="310.0" y="124.5" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="middle">runs once</text><path d="M 310.0 136 L 310.0 175" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="170" y="176" width="280" height="50" rx="6" fill="#e7eff8" stroke="#3a6ea5" stroke-width="1.4"/><text x="310.0" y="198.5" font-size="15" font-weight="bold" fill="#1f4f82" text-anchor="middle">Pass 1: layers 7–18</text><text x="310.0" y="214.5" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="middle">blocks 2 and 3</text><path d="M 310.0 226 L 310.0 275" fill="none" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#arrow-blue)"/><text x="320.0" y="255" font-size="13" font-weight="bold" fill="#1f4f82" text-anchor="start">message</text><rect x="170" y="276" width="280" height="50" rx="6" fill="#e7eff8" stroke="#3a6ea5" stroke-width="1.4"/><text x="310.0" y="298.5" font-size="15" font-weight="bold" fill="#1f4f82" text-anchor="middle">Pass 2: layers 7–18</text><text x="310.0" y="314.5" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="middle">same weights</text><path d="M 310.0 326 L 310.0 375" fill="none" stroke="#3a6ea5" stroke-width="1.8" marker-end="url(#arrow-blue)"/><text x="320.0" y="355" font-size="13" font-weight="bold" fill="#1f4f82" text-anchor="start">message</text><rect x="170" y="376" width="280" height="50" rx="6" fill="#e7eff8" stroke="#3a6ea5" stroke-width="1.4"/><text x="310.0" y="398.5" font-size="15" font-weight="bold" fill="#1f4f82" text-anchor="middle">Pass 3: layers 7–18</text><text x="310.0" y="414.5" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="middle">same weights</text><path d="M 170 111 L 130 111 L 130 401" fill="none" stroke="#6b6a66" stroke-width="1.5"/><path d="M 130 301 L 169 301" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><path d="M 130 401 L 169 401" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><text x="120" y="196" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="end">the prelude's</text><text x="120" y="212" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="end">output also</text><text x="120" y="228" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="end">goes into</text><text x="120" y="244" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="end">passes 2</text><text x="120" y="260" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="end">and 3</text><text x="468" y="292" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="start">The message passes</text><text x="468" y="308" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="start">through a learned gate.</text><text x="468" y="324" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="start">It starts fully closed,</text><text x="468" y="340" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="start">so training begins as a</text><text x="468" y="356" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="start">normal non-looped model,</text><text x="468" y="372" font-size="12" font-weight="normal" fill="#1f4f82" text-anchor="start">then the gate opens.</text><path d="M 310.0 426 L 310.0 475" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><rect x="170" y="476" width="280" height="50" rx="6" fill="#f1efea" stroke="#b9b5ab" stroke-width="1.4"/><text x="310.0" y="498.5" font-size="15" font-weight="bold" fill="#2b2a27" text-anchor="middle">Final block: layers 19–24</text><text x="310.0" y="514.5" font-size="12" font-weight="normal" fill="#6b6a66" text-anchor="middle">runs once</text><path d="M 310.0 526 L 310.0 541" fill="none" stroke="#6b6a66" stroke-width="1.5" marker-end="url(#arrow-gray)"/><text x="310.0" y="556" font-size="13" font-weight="normal" fill="#6b6a66" text-anchor="middle">next token</text><text x="320" y="588" font-size="12" font-weight="normal" fill="#2b2a27" text-anchor="middle">6 + 12×3 + 6 = 48. Active parameters: 3.4B at one pass, 5.4B counting all three.</text></svg>
